spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Database connection, read from environment variables so no credentials live
# in the code. The values after ":" are fallbacks for running locally.
spring.datasource.url = jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:UserDB}?connectTimeout=5000

# Username and password
spring.datasource.username = ${DB_USERNAME:admin}
spring.datasource.password = ${DB_PASSWORD:}
